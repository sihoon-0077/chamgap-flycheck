<text x="768" y="231" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">② 반대 끝에 스페이서와 상판을 체결</text>
<text x="768" y="250" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">③ 중앙 변형부와 판 사이 여유 확보</text>
<text x="768" y="269" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">④ 전선에 여유를 두고 베이스에서 고정</text>
<text x="768" y="288" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">⑤ 상판에 물받이·용기를 함께 배치</text>

<text x="768" y="373" font-size="13" fill="#152C49" font-weight="700" text-anchor="start">반드시 실측해서 채울 값</text>
<text x="768" y="395" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">로드셀 길이·폭·높이, 홀 간격·나사산</text>
<text x="768" y="414" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">상·하판 두께와 재료, 스페이서 높이</text>
<text x="768" y="433" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">볼트 길이·체결 토크, 과부하 스토퍼</text>
<text x="768" y="452" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">측하중 억제 구조와 전도 안정성</text>
<rect x="752" y="513" width="320" height="121" rx="6" fill="#F2F6FC" stroke="none" stroke-width="1"/>
<text x="768" y="537" font-size="13" fill="#152C49" font-weight="700" text-anchor="start">검수: 작은 질량 변화가 보이는가</text>
<text x="768" y="559" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">빈 판 영점 → 알려진 질량 → 반복 제거</text>
<text x="768" y="578" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">약 10 g 추가 변화와 반복 잡음 비교</text>
<text x="768" y="597" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">선·튜브를 움직여 영점 변화 기록</text>
<text x="768" y="616" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">10 kg 정격은 10 g 식별 보장이 아님</text>
<text x="50" y="691" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">※ 도면의 원·직사각형은 구조 설명용이다. 표시된 나사홀·로드셀 비율을 출력물에서 재어 가공하지 않는다.</text>

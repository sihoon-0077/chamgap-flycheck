<text x="794" y="263" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">용기·배지·물·상판을 포함한 총질량</text>
<text x="794" y="282" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">전자장치로 흘러가지 않는 낙수 경로</text>

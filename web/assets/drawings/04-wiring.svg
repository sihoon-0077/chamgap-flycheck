<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="792" viewBox="0 0 1120 792" role="img" aria-label="04  한 구역 신호 배선 · 하네스">
<style>text{font-family:"Malgun Gothic","Noto Sans KR",sans-serif}</style>
<rect x="0" y="0" width="1120" height="792" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1"/>
<text x="48" y="35" font-size="12" fill="#2F6BDE" font-weight="700" text-anchor="start">CHAMGAP  /  FLYCHECK</text>
<text x="48" y="74" font-size="27" fill="#152C49" font-weight="700" text-anchor="start">04  한 구역 신호 배선 · 하네스</text>
<text x="48" y="103" font-size="12" fill="#61738B" font-weight="400" text-anchor="start">클래식 ESP32 DevKit 기준 검토안 / 실제 커넥터 핀 번호·전선 색상·기판 방향은 실물로 확정</text>
<rect x="850" y="32" width="222" height="28" rx="6" fill="#F2F6FC" stroke="#D6E0EC" stroke-width="1"/>
<text x="961" y="51" font-size="12" fill="#2F6BDE" font-weight="700" text-anchor="middle">제작 검토용 v1 / 미실측</text>
<line x1="48" y1="119" x2="1072" y2="119" stroke="#D6E0EC" stroke-width="1.2"/>
<line x1="48" y1="720" x2="1072" y2="720" stroke="#D6E0EC" stroke-width="1.2"/>
<text x="48" y="740" font-size="10" fill="#61738B" font-weight="400" text-anchor="start">도면 기준  MASTER v4 · 18-21 / 29장   |   단위 mm   |   표기 치수 우선 · 축척 없음</text>
<text x="48" y="758" font-size="10" fill="#61738B" font-weight="400" text-anchor="start">실물 홀·체결·하중·DC 차단 정격 확정 전 가공 및 통전 승인용으로 사용하지 않음</text>
<text x="1072" y="742" font-size="11" fill="#152C49" font-weight="700" text-anchor="end">CG-HW-04   /   2026.10.01</text>
<text x="1072" y="760" font-size="10" fill="#61738B" font-weight="400" text-anchor="end">04 / 08</text>
<rect x="63" y="193" width="221" height="359" rx="7" fill="#F2F6FC" stroke="#2F6BDE" stroke-width="1.5"/>
<text x="173" y="224" font-size="18" fill="#152C49" font-weight="700" text-anchor="middle">E01  ESP32</text>
<text x="81" y="270" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">I2C SDA / SCL</text>
<text x="264" y="270" font-size="12" fill="#2F6BDE" font-weight="700" text-anchor="end">21 / 22</text>
<text x="81" y="315" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">수분 A / B ADC1</text>
<text x="264" y="315" font-size="12" fill="#2F6BDE" font-weight="700" text-anchor="end">32 / 33</text>
<text x="81" y="360" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">HX711 DT / SCK</text>
<text x="264" y="360" font-size="12" fill="#2F6BDE" font-weight="700" text-anchor="end">26 / 27</text>
<text x="81" y="405" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">펌프 명령</text>
<text x="264" y="405" font-size="12" fill="#2F6BDE" font-weight="700" text-anchor="end">25</text>
<text x="81" y="450" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">정지 보조 입력</text>
<text x="264" y="450" font-size="12" fill="#2F6BDE" font-weight="700" text-anchor="end">34</text>
<text x="81" y="495" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">누수 보조 입력</text>
<text x="264" y="495" font-size="12" fill="#2F6BDE" font-weight="700" text-anchor="end">35</text>
<text x="82" y="534" font-size="11" fill="#152C49" font-weight="700" text-anchor="start">3V3 / GND · USB 5V 입력</text>
<rect x="397" y="160" width="360" height="64" rx="5" fill="#FFFFFF" stroke="#2F6BDE" stroke-width="1"/>
<text x="414" y="184" font-size="14" fill="#152C49" font-weight="700" text-anchor="start">E02  SHT31 A / B</text>
<text x="414" y="207" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">0x44 / 0x45 주소를 각각 검수</text>
<text x="379" y="184" font-size="11" fill="#2F6BDE" font-weight="700" text-anchor="end">H01-04</text>
<rect x="397" y="250" width="360" height="64" rx="5" fill="#FFFFFF" stroke="#2F6BDE" stroke-width="1"/>
<text x="414" y="274" font-size="14" fill="#152C49" font-weight="700" text-anchor="start">E03  SEN0193 A / B</text>
<text x="414" y="297" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">3V3 · GND · OUT(A=32, B=33)</text>
<text x="379" y="274" font-size="11" fill="#2F6BDE" font-weight="700" text-anchor="end">H05-06</text>
<rect x="397" y="340" width="360" height="64" rx="5" fill="#FFFFFF" stroke="#2F6BDE" stroke-width="1"/>
<text x="414" y="364" font-size="14" fill="#152C49" font-weight="700" text-anchor="start">E07  HX711</text>
<text x="414" y="387" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">DT=26 / SCK=27 · 로직 전압 검수</text>
<text x="379" y="364" font-size="11" fill="#2F6BDE" font-weight="700" text-anchor="end">H07-08</text>
<rect x="397" y="430" width="360" height="64" rx="5" fill="#FFFFFF" stroke="#2F6BDE" stroke-width="1"/>
<text x="414" y="454" font-size="14" fill="#152C49" font-weight="700" text-anchor="start">E05  DFR0457</text>
<text x="414" y="477" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">25 → 신호 / 외부 OFF 바이어스</text>
<text x="379" y="454" font-size="11" fill="#2F6BDE" font-weight="700" text-anchor="end">H10</text>
<rect x="397" y="520" width="360" height="64" rx="5" fill="#FFFFFF" stroke="#61738B" stroke-width="1"/>
<text x="414" y="544" font-size="14" fill="#152C49" font-weight="700" text-anchor="start">정지 · 누수 보조 입력회로</text>
<text x="414" y="567" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">34 / 35 · 외부 바이어스·단선 감지</text>
<text x="379" y="544" font-size="11" fill="#61738B" font-weight="700" text-anchor="end">H11-12</text>
<polyline points="284,264 315,264 315,192 397,192" fill="none" stroke="#2F6BDE" stroke-width="1.2"/>
<polyline points="284,309 321,309 321,282 397,282" fill="none" stroke="#2F6BDE" stroke-width="1.2"/>
<polyline points="284,354 314,354 314,372 397,372" fill="none" stroke="#2F6BDE" stroke-width="1.2"/>
<polyline points="284,399 320,399 320,462 397,462" fill="none" stroke="#2F6BDE" stroke-width="1.2"/>
<polyline points="284,444 313,444 313,545 397,545" fill="none" stroke="#2F6BDE" stroke-width="1.2"/>
<polyline points="284,489 319,489 319,565 397,565" fill="none" stroke="#2F6BDE" stroke-width="1.2"/>
<rect x="813" y="340" width="252" height="64" rx="5" fill="#F2F6FC" stroke="#2F6BDE" stroke-width="1"/>
<text x="830" y="365" font-size="13" fill="#152C49" font-weight="700" text-anchor="start">E06  4선식 로드셀</text>
<text x="830" y="388" font-size="12" fill="#61738B" font-weight="400" text-anchor="start">E+ / E- / A+ / A-</text>
<line x1="757" y1="372" x2="813" y2="372" stroke="#2F6BDE" stroke-width="1.4"/>
<text x="785" y="333" font-size="10" fill="#2F6BDE" font-weight="700" text-anchor="middle">H09</text>
<rect x="810" y="152" width="260" height="121" rx="6" fill="#F2F6FC" stroke="none" stroke-width="1"/>
<text x="826" y="176" font-size="13" fill="#152C49" font-weight="700" text-anchor="start">3.3 V 신호 기준</text>
<text x="826" y="198" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">GPIO에 5 V 출력 직결 금지</text>
<text x="826" y="217" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">SHT31 풀업도 3.3 V 기준 확인</text>
<text x="826" y="236" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">GPIO34/35 내부 풀업 없음</text>
<text x="826" y="255" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">3핀 센서/12 V 커넥터 혼용 금지</text>
<rect x="810" y="438" width="260" height="121" rx="6" fill="#F2F6FC" stroke="none" stroke-width="1"/>
<text x="826" y="462" font-size="13" fill="#152C49" font-weight="700" text-anchor="start">모터 제어 전</text>
<text x="826" y="484" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">H10은 제어 신호 경로</text>
<text x="826" y="503" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">3핀의 전원/GND/신호는 제조사 확인</text>
<text x="826" y="522" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">12 V 전력선은 05 도면 참조</text>
<text x="826" y="541" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">부팅·업로드 중 물리 모터 전원 차단</text>
<rect x="63" y="586" width="694" height="43" rx="5" fill="#F2F6FC" stroke="none" stroke-width="1"/>
<text x="78" y="613" font-size="11" fill="#152C49" font-weight="400" text-anchor="start">H13  USB 5V 어댑터 → ESP32 USB-C / 센서 3V3 전원 용량·모듈 호환성 확인</text>
<text x="63" y="660" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">H01/H03: 3V3·GND → SHT31 A/B    H02/H04: GPIO21/22 → SDA/SCL</text>
<text x="63" y="679" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">H07: 검수된 로직 전원·GND → HX711    H09: 로드셀 선 색상은 판매 자료 우선</text>
<text x="63" y="698" font-size="11" fill="#61738B" font-weight="400" text-anchor="start">하네스 양 끝에 Z1-H01 형식으로 표시. Z2/Z3도 같은 규칙으로 식별한다.</text>
</svg>